<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Stats</title>
    <script>
        /* 主题预置：与 admin.html 共用 admin-theme，避免跨页切换后闪白 */
        (function () {
            try {
                var t = localStorage.getItem('admin-theme');
                if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        /* ========== 主题变量 ==========
           与 admin.html / client-demo.html 共用同一套 token 命名与取值（浅色为默认）。
           --info / --shadow / --radius 为统计页扩展。 */
        :root, [data-theme="light"] {
            --bg: #f5f6f8;
            --card: #fff;
            --border: #e3e6eb;
            --text: #1f2329;
            --text-dim: #6b7280;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --warn: #d97706;
            --info: #0891b2;
            --radius: 12px;
            --shadow: 0 1px 2px rgba(0,0,0,.04);
        }

        [data-theme="dark"] {
            --bg: #0f1218;
            --card: #171b23;
            --border: #2a303b;
            --text: #e6e9ef;
            --text-dim: #8b93a1;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warn: #f59e0b;
            --info: #22d3ee;
            --shadow: 0 1px 2px rgba(0,0,0,.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .2s, color .2s;
        }

        .header {
            border-bottom: 1px solid var(--border);
            background: var(--card);
            box-shadow: var(--shadow);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background .2s, border-color .2s;
        }

        .header h1 { font-size: 18px; font-weight: 600; }

        .header .tag {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .header .back-btn {
            margin-left: auto;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .header .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .theme-btn {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-dim);
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
            transition: border-color .15s, color .15s;
        }

        .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

        .token-bar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 20px;
            margin: 24px auto 0;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .token-bar label {
            font-size: 13px;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .token-bar input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text);
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .token-bar input:focus { border-color: var(--accent); }

        .token-bar .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            flex-shrink: 0;
        }

        .token-bar .status.active { background: var(--success); }

        .token-bar .load-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .token-bar .load-btn:hover { background: var(--accent-hover); }

        .container {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .loading {
            text-align: center;
            padding: 60px 0;
            color: var(--text-dim);
            font-size: 14px;
        }

        .loading .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Overview Cards */
        .overview {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-card .label {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card.accent .value { color: var(--accent); }
        .stat-card.success .value { color: var(--success); }
        .stat-card.danger .value { color: var(--danger); }
        .stat-card.warn .value { color: var(--warn); }
        .stat-card.info .value { color: var(--info); }

        /* Chart Grid */
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .chart-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
        }

        .chart-wrap {
            position: relative;
            width: 100%;
            max-height: 280px;
        }

        .chart-card.wide {
            grid-column: 1 / -1;
        }

        /* Table */
        .table-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 24px;
            overflow-x: auto;
        }

        .table-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid var(--border);
            color: var(--text-dim);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge.paid { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
        .badge.trial { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
        .badge.active { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); }
        .badge.expired { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
        .badge.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

        .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        @media (max-width: 768px) {
            .overview { grid-template-columns: repeat(2, 1fr); }
            .charts { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>License Stats</h1>
    <span class="tag">Dashboard</span>
    <a href="/admin" class="back-btn">← 返回管理</a>
    <button class="theme-btn" id="theme-btn" title="切换深色/浅色" aria-label="切换深色/浅色">🌙</button>
</div>

<div class="token-bar">
    <label>Admin Token</label>
    <input type="password" id="tokenInput" placeholder="输入管理员 Token...">
    <div class="status" id="tokenStatus"></div>
    <button class="load-btn" onclick="loadStats()">加载数据</button>
</div>

<div class="container" id="content">
    <div class="loading" id="placeholder">
        输入 Admin Token 后点击「加载数据」
    </div>
</div>

<script>
    const API_BASE = location.origin;
    const tokenInput = document.getElementById('tokenInput');
    const tokenStatus = document.getElementById('tokenStatus');
    const content = document.getElementById('content');
    let charts = [];
    let lastData = null;

    // Remove credentials saved by older versions; keep the token in memory only.
    localStorage.removeItem('lic_admin_token');

    tokenInput.addEventListener('input', () => {
        tokenStatus.classList.toggle('active', tokenInput.value.trim().length > 0);
    });

    // 触发 input 事件恢复状态
    tokenInput.dispatchEvent(new Event('input'));

    // Enter 键加载
    tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadStats(); });

    async function loadStats() {
        const token = tokenInput.value.trim();
        if (!token) { alert('请输入 Admin Token'); return; }

        content.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';

        try {
            const res = await fetch(`${API_BASE}/api/v1/stats`, {
                headers: { 'X-Admin-Token': token }
            });
            const json = await res.json();
            if (!json.ok) throw new Error(json.error || '请求失败');
            renderDashboard(json.data);
        } catch (err) {
            content.innerHTML = `<div class="loading" style="color:var(--danger)">加载失败: ${esc(err.message)}</div>`;
        }
    }

    const COLORS_FALLBACK = ['#ec4899', '#14b8a6', '#a855f7'];
    const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    // 图表配色从主题 token 取，深浅色切换后重新渲染即可自适应
    const palette = () => [
        cssVar('--accent'), cssVar('--success'), cssVar('--warn'), cssVar('--danger'),
        cssVar('--info'), ...COLORS_FALLBACK
    ];

    function renderDashboard(data) {
        lastData = data;
        // Destroy old charts
        charts.forEach(c => c.destroy());
        charts = [];

        const COLORS = palette();
        const TICK = cssVar('--text-dim');
        const GRID = cssVar('--border');

        const o = data.overview;
        let html = '';

        // Overview cards
        html += `<div class="overview">
            <div class="stat-card accent"><div class="value">${o.total}</div><div class="label">总授权数</div></div>
            <div class="stat-card success"><div class="value">${o.active}</div><div class="label">活跃授权</div></div>
            <div class="stat-card danger"><div class="value">${o.expired}</div><div class="label">已过期</div></div>
            <div class="stat-card warn"><div class="value">${o.expiring_30d}</div><div class="label">30天内到期</div></div>
            <div class="stat-card info"><div class="value">${o.unique_machines}</div><div class="label">独立机器</div></div>
        </div>`;

        // Charts row 1: App + Type + Channel
        html += `<div class="charts">
            <div class="chart-card">
                <h3>应用分布</h3>
                <div class="chart-wrap"><canvas id="chartApp"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>授权类型</h3>
                <div class="chart-wrap"><canvas id="chartType"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>签发渠道</h3>
                <div class="chart-wrap"><canvas id="chartChannel"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>签发者分布</h3>
                <div class="chart-wrap"><canvas id="chartCreator"></canvas></div>
            </div>
        </div>`;

        // Monthly trend (wide)
        html += `<div class="charts">
            <div class="chart-card wide">
                <h3>月度签发趋势</h3>
                <div class="chart-wrap"><canvas id="chartMonthly"></canvas></div>
            </div>
        </div>`;

        // Customer distribution + Expiring soon
        html += `<div class="charts">
            <div class="chart-card">
                <h3>客户分布</h3>
                <div class="chart-wrap"><canvas id="chartCustomer"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>状态分布</h3>
                <div class="chart-wrap"><canvas id="chartStatus"></canvas></div>
            </div>
        </div>`;

        // Expiring soon table
        html += `<div class="table-card">
            <h3>⚠️ 30天内即将到期</h3>
            ${data.expiring_soon.length ? `<table>
                <tr><th>应用</th><th>客户</th><th>机器码后4位</th><th>类型</th><th>签发时间</th><th>到期时间</th></tr>
                ${data.expiring_soon.map(r => `<tr>
                    <td>${esc(r.app_name)}</td>
                    <td>${esc(r.customer_name || '-')}</td>
                    <td class="mono">${esc(r.machine_code_last4)}</td>
                    <td><span class="badge ${esc(r.license_type)}">${esc(r.license_type)}</span></td>
                    <td class="mono">${fmtDate(r.issued_at)}</td>
                    <td class="mono">${esc(r.expires_at)}</td>
                </tr>`).join('')}
            </table>` : '<div class="empty">暂无即将到期的授权</div>'}
        </div>`;

        // Recent issues table
        html += `<div class="table-card">
            <h3>📋 最近签发记录</h3>
            <table>
                <tr><th>应用</th><th>客户</th><th>机器码</th><th>类型</th><th>渠道</th><th>签发时间</th><th>到期时间</th><th>签发者</th></tr>
                ${data.recent_issues.map(r => `<tr>
                    <td>${esc(r.app_name)}</td>
                    <td>${esc(r.customer_name || '-')}</td>
                    <td class="mono">${esc(r.machine_code_last4)}</td>
                    <td><span class="badge ${esc(r.license_type)}">${esc(r.license_type)}</span></td>
                    <td>${esc(r.channel)}</td>
                    <td class="mono">${fmtDate(r.issued_at)}</td>
                    <td class="mono">${esc(r.expires_at)}</td>
                    <td>${esc(r.created_by)}</td>
                </tr>`).join('')}
            </table>
        </div>`;

        content.innerHTML = html;

        // Render charts
        const chartOpts = { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: TICK, font: { size: 12 } } } } };
        const doughnutOpts = { ...chartOpts, cutout: '55%', plugins: { ...chartOpts.plugins, legend: { position: 'bottom', labels: { color: TICK, font: { size: 12 }, padding: 16 } } } };

        // App distribution
        charts.push(new Chart(document.getElementById('chartApp'), {
            type: 'doughnut',
            data: {
                labels: data.app_distribution.map(d => d.app_name),
                datasets: [{ data: data.app_distribution.map(d => d.count), backgroundColor: COLORS, borderWidth: 0 }]
            },
            options: doughnutOpts
        }));

        // Type distribution
        charts.push(new Chart(document.getElementById('chartType'), {
            type: 'doughnut',
            data: {
                labels: data.type_distribution.map(d => d.license_type),
                datasets: [{ data: data.type_distribution.map(d => d.count), backgroundColor: [COLORS[0], COLORS[2]], borderWidth: 0 }]
            },
            options: doughnutOpts
        }));

        // Channel distribution
        charts.push(new Chart(document.getElementById('chartChannel'), {
            type: 'doughnut',
            data: {
                labels: data.channel_distribution.map(d => d.channel),
                datasets: [{ data: data.channel_distribution.map(d => d.count), backgroundColor: [COLORS[1], COLORS[4]], borderWidth: 0 }]
            },
            options: doughnutOpts
        }));

        // Creator distribution
        charts.push(new Chart(document.getElementById('chartCreator'), {
            type: 'doughnut',
            data: {
                labels: data.creator_distribution.map(d => d.created_by),
                datasets: [{ data: data.creator_distribution.map(d => d.count), backgroundColor: [COLORS[7], COLORS[5]], borderWidth: 0 }]
            },
            options: doughnutOpts
        }));

        // Monthly trend
        charts.push(new Chart(document.getElementById('chartMonthly'), {
            type: 'bar',
            data: {
                labels: data.monthly_trend.map(d => d.month),
                datasets: [{
                    label: '签发数',
                    data: data.monthly_trend.map(d => d.count),
                    backgroundColor: COLORS[0] + '99',
                    borderColor: COLORS[0],
                    borderWidth: 2,
                    borderRadius: 6,
                    barThickness: 60
                }]
            },
            options: {
                ...chartOpts,
                plugins: { ...chartOpts.plugins, legend: { display: false } },
                scales: {
                    x: { ticks: { color: TICK }, grid: { display: false } },
                    y: { ticks: { color: TICK, stepSize: 1 }, grid: { color: GRID }, beginAtZero: true }
                }
            }
        }));

        // Customer distribution
        if (data.customer_distribution.length) {
            charts.push(new Chart(document.getElementById('chartCustomer'), {
                type: 'bar',
                data: {
                    labels: data.customer_distribution.map(d => d.customer_name),
                    datasets: [{
                        label: '授权数',
                        data: data.customer_distribution.map(d => d.count),
                        backgroundColor: COLORS.slice(0, data.customer_distribution.length),
                        borderRadius: 6,
                        barThickness: 36
                    }]
                },
                options: {
                    indexAxis: 'y',
                    ...chartOpts,
                    plugins: { ...chartOpts.plugins, legend: { display: false } },
                    scales: {
                        x: { ticks: { color: TICK, stepSize: 1 }, grid: { color: GRID }, beginAtZero: true },
                        y: { ticks: { color: TICK }, grid: { display: false } }
                    }
                }
            }));
        } else {
            document.getElementById('chartCustomer').parentElement.parentElement.querySelector('h3').textContent += ' (暂无数据)';
        }

        // Status distribution
        charts.push(new Chart(document.getElementById('chartStatus'), {
            type: 'doughnut',
            data: {
                labels: data.status_distribution.map(d => d.status),
                datasets: [{ data: data.status_distribution.map(d => d.count), backgroundColor: [COLORS[1], COLORS[3], COLORS[2]], borderWidth: 0 }]
            },
            options: doughnutOpts
        }));
    }

    // ---- 主题切换（与 admin.html 共用 admin-theme；切换后按最近一次数据重绘图表）----
    const THEME_KEY = 'admin-theme';
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-btn');
        btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        btn.title = theme === 'dark' ? '切换浅色' : '切换深色';
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }
    document.getElementById('theme-btn').addEventListener('click', function () {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        if (lastData) renderDashboard(lastData);
    });
    applyTheme(document.documentElement.getAttribute('data-theme') || 'light');

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    // 时间显示：存储为 UTC，此处转北京时间（Asia/Shanghai）——标准做法「存 UTC、显示本地」
    // 统一按 UTC 解析（补 T/Z），避免无时区标记的串被浏览器按本地时区误解析。
    function fmtDate(s) {
        if (!s) return '-';
        let t = String(s).trim().replace(' ', 'T');
        if (!/[zZ]|[+-]\d{2}:?\d{2}$/.test(t)) t += 'Z';
        const d = new Date(t);
        if (isNaN(d)) return String(s).slice(0, 16);
        const b = new Date(d.getTime() + 8 * 3600e3); // 北京 = UTC+8（无夏令时）
        const p = n => String(n).padStart(2, '0');
        return `${b.getUTCFullYear()}-${p(b.getUTCMonth() + 1)}-${p(b.getUTCDate())} ${p(b.getUTCHours())}:${p(b.getUTCMinutes())}`;
    }
</script>
</body>
</html>
