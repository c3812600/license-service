<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Admin</title>
    <script>
        /* 主题预置：先落 data-theme，避免深色偏好在首帧闪白（与 client-demo.html 同一套深浅语义） */
        (function () {
            try {
                var t = localStorage.getItem('admin-theme');
                if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <style>
        /* ========== 主题变量 ==========
           基础 token 与客户端 client-demo.html 完全一致（同一套设计语言，浅色为默认）。
           --head-bg / --row-hover / --sticky-shadow / --mask 为管理端扩展 token。 */
        :root, [data-theme="light"] {
            --bg: #f5f6f8; --card: #fff; --border: #e3e6eb; --text: #1f2329;
            --text-dim: #6b7280; --accent: #2563eb; --accent-hover: #1d4ed8;
            --success: #16a34a; --warn: #d97706; --danger: #dc2626;
            --head-bg: #fafbfc; --row-hover: #f7f9fc;
            --sticky-shadow: rgba(15,18,25,.12);
            --mask: rgba(15,18,25,.45);
            --radius: 12px;
            --shadow: 0 1px 2px rgba(0,0,0,.04);
        }
        [data-theme="dark"] {
            --bg: #0f1218; --card: #171b23; --border: #2a303b; --text: #e6e9ef;
            --text-dim: #8b93a1; --accent: #3b82f6; --accent-hover: #2563eb;
            --success: #22c55e; --warn: #f59e0b; --danger: #ef4444;
            --head-bg: #1a1f28; --row-hover: #1e242e;
            --sticky-shadow: rgba(0,0,0,.55);
            --mask: rgba(0,0,0,.6);
            --shadow: 0 1px 2px rgba(0,0,0,.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background .2s, color .2s; }
        .token-bar { display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: var(--card); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); font-size: 13px; flex-wrap: wrap; transition: background .2s, border-color .2s; }
        .token-bar label { color: var(--text-dim); white-space: nowrap; }
        .token-bar input { flex: 0 1 340px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s; }
        .token-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
        .token-bar .status { color: var(--text-dim); }
        .token-bar .status.active { color: var(--success); }
        .theme-btn { width: 30px; height: 28px; padding: 0; margin-left: auto; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-dim); font-size: 13px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; transition: border-color .15s, color .15s; }
        .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

        .container { max-width: 1180px; margin: 0 auto; padding: 20px 24px 60px; }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); transition: background .2s, border-color .2s; }
        .stat .num { font-size: 24px; font-weight: 700; }
        .stat .lbl { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
        .stat.s-active .num { color: var(--success); }
        .stat.s-soon .num { color: var(--warn); }
        .stat.s-expired .num { color: var(--danger); }

        .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .toolbar input[type=text] { flex: 1 1 260px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s; }
        .toolbar input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
        .toolbar select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; outline: none; }

        .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; cursor: pointer; transition: all .15s; }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); color: #fff; }
        .btn-danger { background: transparent; border-color: color-mix(in srgb, var(--danger) 40%, transparent); color: var(--danger); }
        .btn-danger:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); border-color: var(--danger); color: var(--danger); }
        .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }

        .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; box-shadow: var(--shadow); transition: background .2s, border-color .2s; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
        /* 备注列：截短到固定宽，隐藏文字可在单元格内横向滚动/拖选，悬停有全文提示 */
        th.notes, td.notes { max-width: 176px; }
        td.notes .scroll-x { display: block; max-width: 176px; overflow-x: auto; overflow-y: hidden; white-space: nowrap; cursor: text; scrollbar-width: none; }
        td.notes .scroll-x::-webkit-scrollbar { display: none; }
        /* 悬停整格渐显细滚动条，平时零视觉噪音 */
        td.notes:hover .scroll-x::-webkit-scrollbar { display: block; height: 3px; }
        td.notes:hover .scroll-x::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
        /* 机器码列：64 位全量渲染（不再截断），超宽时可横向滚动，点击仍是一键复制 */
        td.mc-col { max-width: 260px; position: relative; }
        td.mc-col .scroll-x { display: block; max-width: 260px; overflow-x: auto; overflow-y: hidden; white-space: nowrap; scrollbar-width: none; }
        td.mc-col .scroll-x::-webkit-scrollbar { display: none; }
        td.mc-col:hover .scroll-x::-webkit-scrollbar { display: block; height: 3px; }
        td.mc-col:hover .scroll-x::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
        /* 溢出提示：右侧渐隐，滚到末尾自动消失 */
        td.mc-col::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 26px; pointer-events: none; background: linear-gradient(to right, transparent, var(--card)); opacity: 0; transition: opacity .15s; }
        td.mc-col.ovf::after { opacity: 1; }
        td.mc-col.ovf.end::after { opacity: 0; }
        tr:hover td.mc-col.ovf::after { background: linear-gradient(to right, transparent, var(--row-hover)); }
        th { color: var(--text-dim); font-weight: 500; font-size: 12px; background: var(--head-bg); }
        /* 操作列右侧固定：横向滚动时按钮永不被裁掉 */
        th.ops, td.ops { position: sticky; right: 0; box-shadow: -8px 0 10px -8px var(--sticky-shadow); }
        td.ops { background: var(--card); }
        th.ops { background: var(--head-bg); }
        tr:hover td.ops { background: var(--row-hover); }
        @media (max-width: 1280px) {
            th, td { padding: 8px 9px; }
            .container { padding: 16px 14px 50px; }
            .stat { padding: 11px 13px; }
            .stat .num { font-size: 21px; }
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--row-hover); }
        .mc { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.5px; cursor: pointer; }
        .mc:hover { color: var(--accent-hover); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; }
        .badge.active { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); }
        .badge.soon { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
        .badge.expired { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
        .badge.none { background: color-mix(in srgb, var(--text-dim) 16%, transparent); color: var(--text-dim); }
        .dim { color: var(--text-dim); }
        .summary-line { margin-top: 10px; font-size: 12px; color: var(--text-dim); }

        .modal-mask { position: fixed; inset: 0; background: var(--mask); display: none; align-items: center; justify-content: center; z-index: 50; }
        .modal-mask.show { display: flex; }
        .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; width: 440px; max-width: 92vw; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
        .modal h3 { font-size: 15px; margin-bottom: 14px; }
        .modal .field { margin-bottom: 12px; }
        .modal label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
        .modal input[type=text], .modal input[type=date], .modal select, .modal textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; outline: none; }
        .modal input[readonly] { color: var(--text-dim); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
        .modal textarea { resize: none; font-family: ui-monospace, Consolas, monospace; font-size: 11px; word-break: break-all; }
        .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .modal .check { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.5; }
        .modal .check input { margin-top: 3px; }
        .modal .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
        .msg { font-size: 12.5px; margin-top: 10px; min-height: 16px; word-break: break-all; }
        .msg.ok { color: var(--success); }
        .msg.err { color: var(--danger); }

        @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="token-bar">
        <label>Admin Token:</label>
        <input type="password" id="admin-token" placeholder="粘贴 X-Admin-Token（仅本标签页，关闭即失效）" />
        <button class="btn btn-sm" onclick="saveToken()">保存</button>
        <span class="status" id="token-status">未验证</span>
        <button class="theme-btn" id="theme-btn" title="切换深色/浅色" aria-label="切换深色/浅色">🌙</button>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat s-total"><div class="num" id="st-total">–</div><div class="lbl">设备总数</div></div>
            <div class="stat s-active"><div class="num" id="st-active">–</div><div class="lbl">有效授权（30天以上）</div></div>
            <div class="stat s-soon"><div class="num" id="st-soon">–</div><div class="lbl">30天内到期</div></div>
            <div class="stat s-expired"><div class="num" id="st-expired">–</div><div class="lbl">已过期</div></div>
        </div>

        <div class="toolbar">
            <input type="text" id="search-box" placeholder="搜索：机器码 / 客户名称 / 备注…" />
            <select id="app-filter">
                <option value="">全部应用</option>
                <option value="ControlCommand">ControlCommand</option>
                <option value="E-Player">E-Player</option>
                <option value="WinPilot">WinPilot</option>
                <option value="iCMS">iCMS</option>
                <option value="rust-node">rust-node</option>
            </select>
            <button class="btn" onclick="loadDevices()">↻ 刷新</button>
            <button class="btn btn-primary" onclick="openIssueModal()">＋ 签发授权</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>应用</th><th>机器码（点击复制）</th><th>客户名称</th><th class="notes">备注</th>
                        <th>到期日期</th><th>状态</th><th>最近出现</th><th class="ops">操作</th>
                    </tr>
                </thead>
                <tbody id="device-rows">
                    <tr><td colspan="8" class="dim">加载中…</td></tr>
                </tbody>
            </table>
        </div>
        <div class="summary-line" id="list-summary"></div>
    </div>

    <!-- 续期弹窗 -->
    <div class="modal-mask" id="renew-mask">
        <div class="modal">
            <h3>续期授权</h3>
            <div class="field"><label>应用 / 机器码</label>
                <input type="text" id="rn-target" readonly />
            </div>
            <div class="row2">
                <div class="field"><label>客户名称</label><input type="text" id="rn-customer" placeholder="（可留空）" /></div>
                <div class="field"><label>备注</label><input type="text" id="rn-notes" placeholder="（可留空）" /></div>
            </div>
            <div class="row2">
                <div class="field"><label>到期日期 *</label><input type="date" id="rn-expires" /></div>
                <div class="field"><label>授权类型</label>
                    <select id="rn-type"><option value="paid">付费 (paid)</option><option value="trial">试用 (trial)</option></select>
                </div>
            </div>
            <label class="check"><input type="checkbox" id="rn-supersede" /> 签发前吊销该设备旧授权（缩短有效期时勾选）</label>
            <div class="msg" id="rn-msg"></div>
            <div class="foot">
                <button class="btn" onclick="closeModal('renew-mask')">取消</button>
                <button class="btn btn-primary" onclick="doRenew()">续期签发</button>
            </div>
        </div>
    </div>

    <!-- 签发弹窗（新设备/离线） -->
    <div class="modal-mask" id="issue-mask">
        <div class="modal">
            <h3>签发授权</h3>
            <div class="row2">
                <div class="field"><label>应用</label>
                    <select id="is-app">
                        <option value="ControlCommand">ControlCommand</option>
                        <option value="E-Player">E-Player</option>
                        <option value="WinPilot">WinPilot</option>
                        <option value="iCMS">iCMS</option>
                        <option value="rust-node">rust-node</option>
                    </select>
                </div>
                <div class="field"><label>授权类型</label>
                    <select id="is-type"><option value="paid">付费 (paid)</option><option value="trial">试用 (trial)</option></select>
                </div>
            </div>
            <div class="field"><label>机器码 *</label><input type="text" id="is-machine" placeholder="粘贴 64 位机器码" /></div>
            <div class="row2">
                <div class="field"><label>客户名称</label><input type="text" id="is-customer" placeholder="（可留空）" /></div>
                <div class="field"><label>备注</label><input type="text" id="is-notes" placeholder="（可留空）" /></div>
            </div>
            <div class="field"><label>到期日期 *</label><input type="date" id="is-expires" /></div>
            <label class="check"><input type="checkbox" id="is-offline" /> 离线签发（产出授权码，供无法联网的设备手动导入）</label>
            <label class="check"><input type="checkbox" id="is-supersede" /> 签发前吊销该设备旧授权（缩短有效期时勾选）</label>
            <div class="msg" id="is-msg"></div>
            <div class="foot">
                <button class="btn" onclick="closeModal('issue-mask')">取消</button>
                <button class="btn btn-primary" onclick="doIssue()">签发</button>
            </div>
        </div>
    </div>

    <script>
    const API_BASE = '';
    let currentDevice = null;

    function getToken() { return sessionStorage.getItem('admin_token') || ''; }
    function saveToken() {
        const v = document.getElementById('admin-token').value.trim();
        sessionStorage.setItem('admin_token', v);
        const st = document.getElementById('token-status');
        st.textContent = v ? '已保存' : '未验证';
        st.className = 'status' + (v ? ' active' : '');
        loadDevices();
    }
    async function api(path, options = {}) {
        const resp = await fetch(API_BASE + path, {
            ...options,
            headers: { 'Content-Type': 'application/json', 'X-Admin-Token': getToken(), ...(options.headers || {}) }
        });
        return resp.json();
    }
    function fmtMachine(mc) { return (mc.match(/.{1,8}/g) || [mc]).join(' '); }
    // 时间显示：存储为 UTC，此处转北京时间（Asia/Shanghai）——标准做法「存 UTC、显示本地」
    // 注意 last_seen 形如 "YYYY-MM-DD HH:MM:SS"（无时区标记），须显式补 Z 按 UTC 解析，
    // 否则 new Date() 会按浏览器本地时区误解析、+8h 变双重转换。
    function fmtSeen(ts) {
        if (!ts) return '';
        let s = String(ts).trim().replace(' ', 'T');
        if (!/[zZ]|[+-]\d{2}:?\d{2}$/.test(s)) s += 'Z';
        const d = new Date(s);
        if (isNaN(d)) return String(ts).slice(0, 16);
        const b = new Date(d.getTime() + 8 * 3600e3); // 北京 = UTC+8（无夏令时）
        const p = n => String(n).padStart(2, '0');
        return `${b.getUTCFullYear()}-${p(b.getUTCMonth() + 1)}-${p(b.getUTCDate())} ${p(b.getUTCHours())}:${p(b.getUTCMinutes())}`;
    }
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function badge(d) {
        if (d.license_state === 'expired') return '<span class="badge expired">已过期</span>';
        if (d.license_state === 'none') return '<span class="badge none">无授权</span>';
        const soon = new Date(); soon.setDate(soon.getDate() + 30);
        if (d.expires_at && new Date(d.expires_at.slice(0,10)) <= soon) return '<span class="badge soon">即将到期</span>';
        return '<span class="badge active">有效</span>';
    }

    async function loadDevices() {
        const q = document.getElementById('search-box').value.trim();
        const app = document.getElementById('app-filter').value;
        const res = await api(`/api/v1/devices?q=${encodeURIComponent(q)}&app_name=${encodeURIComponent(app)}`);
        const tb = document.getElementById('token-status');
        if (!res.ok) {
            document.getElementById('device-rows').innerHTML = `<tr><td colspan="8" class="dim">${esc(res.error || '加载失败（检查 Token）')}</td></tr>`;
            tb.textContent = 'Token 无效'; tb.className = 'status';
            return;
        }
        tb.textContent = '已连接'; tb.className = 'status active';
        const { devices, summary } = res.data;
        document.getElementById('st-total').textContent = summary.total;
        document.getElementById('st-active').textContent = summary.active;
        document.getElementById('st-soon').textContent = summary.expiring_soon;
        document.getElementById('st-expired').textContent = summary.expired;
        if (!devices.length) {
            document.getElementById('device-rows').innerHTML = '<tr><td colspan="8" class="dim">暂无设备（设备与服务器交互或签发授权后自动出现在此）</td></tr>';
            document.getElementById('list-summary').textContent = '';
            return;
        }
        document.getElementById('device-rows').innerHTML = devices.map(d => `
            <tr>
                <td>${esc(d.app_name)}</td>
                <td class="mc-col"><span class="mc scroll-x" title="点击复制完整机器码" onclick="copyMachine(this)" data-mc="${esc(d.machine_code)}">${fmtMachine(d.machine_code)}</span></td>
                <td>${esc(d.customer_name) || '<span class="dim">—</span>'}</td>
                <td class="notes">${d.notes ? `<span class="scroll-x" title="${esc(d.notes)}">${esc(d.notes)}</span>` : '<span class="dim">—</span>'}</td>
                <td>${d.expires_at ? esc(d.expires_at.slice(0,10)) : '<span class="dim">—</span>'}</td>
                <td>${badge(d)}</td>
                <td class="dim">${fmtSeen(d.last_seen)}</td>
                <td class="ops">
                    <button class="btn btn-sm" title="复制该设备当前有效的授权码" onclick='copyLicenseOf(${JSON.stringify(JSON.stringify(d))}, this)'>📋 授权码</button>
                    <button class="btn btn-sm" onclick='openRenewModal(${JSON.stringify(JSON.stringify(d))})'>续期</button>
                    <button class="btn btn-sm btn-danger" onclick='doForget(${JSON.stringify(JSON.stringify(d))})'>重置</button>
                </td>
            </tr>`).join('');
        syncMachineFades();
        document.getElementById('list-summary').textContent =
            `共 ${summary.total} 台设备 · 有效 ${summary.active} · 30天内到期 ${summary.expiring_soon} · 已过期 ${summary.expired}`;
    }

    function copyText(text) {
        // HTTPS 走 clipboard API；纯 HTTP（局域网 IP:8765）无安全上下文，退回选中+execCommand
        if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
        return new Promise((resolve, reject) => {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy') ? resolve() : reject(); }
            catch (e) { reject(e); } finally { ta.remove(); }
        });
    }
    function copyLicenseKey(btn) {
        const key = document.getElementById('offline-key').value;
        copyText(key).then(() => {
            const t = btn.textContent; btn.textContent = '✓ 已复制';
            setTimeout(() => btn.textContent = t, 1200);
        }).catch(() => {
            const t = btn.textContent; btn.textContent = '复制失败，请全选手动复制';
            setTimeout(() => btn.textContent = t, 2000);
        });
    }
    function copyMachine(el) {
        copyText(el.dataset.mc).then(() => {
            const t = el.textContent; el.textContent = '已复制';
            setTimeout(() => el.textContent = t, 1200);
        });
    }

    async function copyLicenseOf(dStr, btn) {
        const d = JSON.parse(dStr);
        const t = btn.textContent;
        const res = await api('/api/v1/licenses/active_key?app_name=' + encodeURIComponent(d.app_name) + '&machine_code=' + encodeURIComponent(d.machine_code));
        if (res && res.data && res.data.license_key) {
            copyText(res.data.license_key).then(() => {
                btn.textContent = '✓ 已复制';
                setTimeout(() => btn.textContent = t, 1200);
            }).catch(() => {
                btn.textContent = '复制失败';
                setTimeout(() => btn.textContent = t, 1500);
            });
        } else {
            btn.textContent = (res && res.error) ? res.error : '无有效授权';
            setTimeout(() => btn.textContent = t, 1800);
        }
    }

    let searchTimer = null;
    document.getElementById('search-box').addEventListener('input', () => {
        clearTimeout(searchTimer); searchTimer = setTimeout(loadDevices, 300);
    });
    document.getElementById('app-filter').addEventListener('change', loadDevices);

    // ---- 续期 ----
    function openRenewModal(dStr) {
        const d = JSON.parse(dStr);
        currentDevice = d;
        document.getElementById('rn-target').value = d.app_name + ' / ' + d.machine_code;
        document.getElementById('rn-customer').value = d.customer_name || '';
        document.getElementById('rn-notes').value = d.notes || '';
        document.getElementById('rn-expires').value = d.expires_at ? d.expires_at.slice(0,10) : '';
        document.getElementById('rn-supersede').checked = false;
        document.getElementById('rn-msg').textContent = '';
        document.getElementById('renew-mask').classList.add('show');
    }
    async function doRenew() {
        const d = currentDevice;
        const expires = document.getElementById('rn-expires').value;
        const msg = document.getElementById('rn-msg');
        if (!expires) { msg.textContent = '请选择到期日期'; msg.className = 'msg err'; return; }
        msg.textContent = '签发中…'; msg.className = 'msg';
        const customer = document.getElementById('rn-customer').value.trim();
        const notes = document.getElementById('rn-notes').value.trim();
        // 顺带保存客户信息编辑（PATCH 档案；失败不阻断签发）
        await api('/api/v1/devices', { method: 'PATCH', body: JSON.stringify({
            app_name: d.app_name, machine_code: d.machine_code, customer_name: customer, notes: notes
        })}).catch(() => {});
        const res = await api('/api/v1/licenses/renew', { method: 'POST', body: JSON.stringify({
            app_name: d.app_name, machine_code: d.machine_code, expires_at: expires,
            license_type: document.getElementById('rn-type').value,
            customer_name: customer, notes: notes,
            supersede: document.getElementById('rn-supersede').checked
        })});
        if (res.ok) { msg.textContent = `✓ 已签发至 ${res.data.expires_at}`; msg.className = 'msg ok'; loadDevices(); }
        else { msg.textContent = res.error || '签发失败'; msg.className = 'msg err'; }
    }

    // ---- 签发（新设备/离线） ----
    function openIssueModal() {
        document.getElementById('is-machine').value = '';
        document.getElementById('is-customer').value = '';
        document.getElementById('is-notes').value = '';
        const t = new Date(); t.setFullYear(t.getFullYear() + 1);
        document.getElementById('is-expires').value = t.toISOString().slice(0,10);
        document.getElementById('is-offline').checked = false;
        document.getElementById('is-supersede').checked = false;
        document.getElementById('is-msg').textContent = '';
        document.getElementById('issue-mask').classList.add('show');
    }
    async function doIssue() {
        const app = document.getElementById('is-app').value;
        const machine = document.getElementById('is-machine').value.trim();
        const expires = document.getElementById('is-expires').value;
        const offline = document.getElementById('is-offline').checked;
        const msg = document.getElementById('is-msg');
        if (!machine) { msg.textContent = '请输入机器码'; msg.className = 'msg err'; return; }
        if (!expires) { msg.textContent = '请选择到期日期'; msg.className = 'msg err'; return; }
        msg.textContent = '签发中…'; msg.className = 'msg';
        const body = {
            app_name: app, machine_code: machine, expires_at: expires,
            license_type: document.getElementById('is-type').value,
            customer_name: document.getElementById('is-customer').value.trim(),
            notes: document.getElementById('is-notes').value.trim(),
            supersede: document.getElementById('is-supersede').checked
        };
        const url = offline ? '/api/v1/licenses/offline-issue' : '/api/v1/licenses/renew';
        const res = await api(url, { method: 'POST', body: JSON.stringify(body) });
        if (res.ok) {
            if (offline) {
                msg.innerHTML = `✓ 离线授权码已生成：<br/><textarea id="offline-key" rows="3" readonly onclick="this.select()">${esc(res.data.license_key || JSON.stringify(res.data))}</textarea><br/><button class="btn btn-sm" onclick="copyLicenseKey(this)" style="margin-top:6px">📋 复制授权码</button>`;
            } else {
                msg.textContent = `✓ 已签发至 ${res.data.expires_at}`;
            }
            msg.className = 'msg ok'; loadDevices();
        } else { msg.textContent = res.error || '签发失败'; msg.className = 'msg err'; }
    }

    // ---- 重置（forget） ----
    async function doForget(dStr) {
        const d = JSON.parse(dStr);
        if (!confirm(`将删除 ${d.app_name} / ${fmtMachine(d.machine_code)}\n的全部授权记录与设备凭证（不可恢复），\n删除后设备可重新申请试用。确认重置？`)) return;
        const res = await api('/api/v1/devices/forget', { method: 'POST', body: JSON.stringify({ app_name: d.app_name, machine_code: d.machine_code }) });
        if (res.ok) { alert(`已重置（清除 ${res.data.removed_issues} 条授权记录）`); loadDevices(); }
        else alert(res.error || '重置失败');
    }

    // ---- 主题切换（与客户端 client-demo.html 同一套设计语言：浅色为默认）----
    const THEME_KEY = 'admin-theme';
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-btn');
        btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        btn.title = theme === 'dark' ? '切换浅色' : '切换深色';
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }
    document.getElementById('theme-btn').addEventListener('click', function () {
        applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
    applyTheme(document.documentElement.getAttribute('data-theme') || 'light');

    // ---- 机器码溢出提示（右侧渐隐，滚到末尾消失）----
    function syncMachineFades() {
        document.querySelectorAll('td.mc-col').forEach(function (td) {
            const sc = td.querySelector('.scroll-x');
            if (!sc) return;
            const overflow = sc.scrollWidth > sc.clientWidth + 1;
            const atEnd = sc.scrollLeft + sc.clientWidth >= sc.scrollWidth - 1;
            td.classList.toggle('ovf', overflow);
            td.classList.toggle('end', atEnd);
        });
    }
    document.addEventListener('scroll', function (e) {
        if (e.target && e.target.classList && e.target.classList.contains('scroll-x')) syncMachineFades();
    }, true);
    window.addEventListener('resize', syncMachineFades);

    // 初始化
    document.getElementById('admin-token').value = getToken();
    if (getToken()) { document.getElementById('token-status').textContent = '已保存'; document.getElementById('token-status').className = 'status active'; }
    loadDevices();
    </script>
</body>
</html>
