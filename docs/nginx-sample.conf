# license-service 反向代理示例（nginx）
#
# 用途：HTTPS 终结、IP 限流、请求体限制、管理路径访问控制——这些都属于
# 代理层职责，应用内限流只是兜底（见 AGENTS.md 与 README「部署准备」）。
# 按实际域名、证书路径与上游端口替换后使用；本文件不含真实内网拓扑。

# ---- 限流区（按来源 IP）----
# 每个公开接口单独计数，数值与应用内兜底限流同阶
limit_req_zone $binary_remote_addr zone=lic_challenge:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=lic_trial:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=lic_latest:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=lic_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lic_activate:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lic_validate:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=lic_transfer:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lic_admin:10m    rate=60r/m;

# 兜底：单 IP 总请求速率
limit_req_zone $binary_remote_addr zone=lic_global:10m   rate=10r/s;

upstream license_service {
    server 127.0.0.1:8765;   # gunicorn/uwsgi 监听地址，按实际部署修改
    keepalive 16;
}

server {
    listen 80;
    server_name licenses.example.com;   # 替换为实际域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name licenses.example.com;   # 替换为实际域名

    ssl_certificate     /etc/ssl/certs/licenses.example.com.pem;
    ssl_certificate_key /etc/ssl/private/licenses.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 请求体上限：与应用内 LICENSE_SERVICE_MAX_CONTENT_LENGTH 同阶
    client_max_body_size 64k;
    client_body_timeout 10s;

    limit_req zone=lic_global burst=20 nodelay;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/v1/health {
        limit_req zone=lic_global burst=10 nodelay;
        proxy_pass http://license_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/devices/challenge {
        limit_req zone=lic_challenge burst=5 nodelay;
        proxy_pass http://license_service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/trial/apply {
        limit_req zone=lic_trial burst=3 nodelay;
        proxy_pass http://license_service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/licenses/latest {
        limit_req zone=lic_latest burst=5 nodelay;
        proxy_pass http://license_service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/devices/register {
        limit_req zone=lic_register burst=5 nodelay;
        proxy_pass http://license_service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/activate {
        limit_req zone=lic_activate burst=3 nodelay;
        proxy_pass http://license_service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/validate {
        limit_req zone=lic_validate burst=10 nodelay;
        proxy_pass http://license_service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/licenses/transfer {
        limit_req zone=lic_transfer burst=3 nodelay;
        proxy_pass http://license_service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理台与管理 API：只放行办公网/VPN 段，其余 403
    # （按实际来源网段修改 allow；或改用 basic auth / IP 白名单 + mTLS）
    location /admin {
        allow 127.0.0.1;
        # allow 10.0.0.0/8;
        deny all;
        limit_req zone=lic_admin burst=20 nodelay;
        proxy_pass http://license_service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/stats {
        allow 127.0.0.1;
        # allow 10.0.0.0/8;
        deny all;
        proxy_pass http://license_service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=lic_global burst=20 nodelay;
        proxy_pass http://license_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
